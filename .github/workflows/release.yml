name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find built executable
        id: find_exe
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | ForEach-Object {
            Write-Host "Found: $($_.Name)"
          }
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($exe) {
            echo "EXE_NAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "EXE_FULLNAME=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "SIG_PATH=$($exe.FullName).sig" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Generate updater.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $exeName = if ("${{ steps.find_exe.outputs.EXE_NAME }}" -ne "") { "${{ steps.find_exe.outputs.EXE_NAME }}" } else { "ybkauto_${version}_x86_64-setup.exe" }
          $sigPath = "src-tauri/target/release/bundle/nsis/$exeName.sig"

          $signature = ""
          if (Test-Path $sigPath) {
            $signature = Get-Content $sigPath -Raw
            Write-Host "Signature file found, length: $($signature.Length)"
          } else {
            Write-Host "Warning: Signature file not found at $sigPath"
          }

          $updaterJson = @{
            version = $version
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/9ycrooked/YbkAuto/releases/download/${{ github.ref_name }}/$exeName"
              }
            }
          }

          $jsonContent = $updaterJson | ConvertTo-Json -Depth 3
          $jsonContent | Out-File -FilePath "updater.json" -Encoding UTF8
          Write-Host "updater.json content:"
          Get-Content updater.json

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            updater.json
          generate_release_notes: true