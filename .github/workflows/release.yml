name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

      - name: Find built packages
        id: find_pkg
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $msiDir = "src-tauri/target/release/bundle/msi"
          $pkgName = ""
          $sigPath = ""
          
          if (Test-Path $nsisDir) {
            $zip = Get-ChildItem $nsisDir -Filter "*.nsis.zip" | Select-Object -First 1
            if ($zip) {
              $pkgName = $zip.Name
              $sigPath = "$($zip.FullName).sig"
            }
          }
          
          if ($pkgName -eq "" -and (Test-Path $msiDir)) {
            $zip = Get-ChildItem $msiDir -Filter "*.msi.zip" | Select-Object -First 1
            if ($zip) {
              $pkgName = $zip.Name
              $sigPath = "$($zip.FullName).sig"
            }
          }
          
          if ($pkgName -eq "") {
            Write-Host "Error: No update package found!"
            exit 1
          }
          
          echo "PKG_NAME=$pkgName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "SIG_PATH=$sigPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Found package: $pkgName"

      - name: Generate updater.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $sigPath = "${{ steps.find_pkg.outputs.SIG_PATH }}"
          
          if (-not (Test-Path $sigPath)) {
            Write-Host "Error: Signature file not found at $sigPath"
            exit 1
          }
          
          $signature = Get-Content $sigPath -Raw
          
          $updaterJson = @{
            version = $version
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/9ycrooked/YbkAuto/releases/download/${{ github.ref_name }}/${{ steps.find_pkg.outputs.PKG_NAME }}"
              }
            }
          }
          
          $updaterJson | ConvertTo-Json -Depth 3 | Out-File -FilePath "updater.json" -Encoding UTF8
          Get-Content updater.json

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.zip*
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/msi/*.zip*
            updater.json
          generate_release_notes: true